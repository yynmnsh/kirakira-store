<!doctype html>
<html lang="id">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Bluetooth Printer Diagnostic — Kirakira</title>
<style>
  body { font-family: -apple-system, sans-serif; max-width: 640px; margin: 0 auto; padding: 16px; background:#fff9fb; color:#2b2438; }
  h1 { font-size: 18px; }
  .warn { background:#fbedd8; color:#e08a2e; padding:10px 14px; border-radius:10px; font-size:13px; margin-bottom:14px; }
  button { display:block; width:100%; padding:14px; margin:8px 0; border:none; border-radius:10px; font-size:15px; font-weight:600; cursor:pointer; }
  .primary { background:#ff6fa5; color:#fff; }
  .secondary { background:#ece9fa; color:#2b2438; }
  select { width:100%; padding:12px; border-radius:10px; border:1px solid #f0e0e8; margin:8px 0; font-size:14px; }
  #log { background:#111; color:#0f0; font-family: monospace; font-size:12px; white-space:pre-wrap; padding:12px; border-radius:10px; height:320px; overflow-y:auto; margin-top:14px; }
  .badge { display:inline-block; padding:2px 8px; border-radius:999px; font-size:11px; background:#dff5ee; color:#35b28c; margin-right:4px; }
</style>
</head>
<body>
<h1>🖨️ Bluetooth Printer Diagnostic</h1>
<div class="warn">
  Buka halaman ini lewat <b>Chrome</b> (bukan Samsung Internet). Pastikan Bluetooth HP menyala dan printer dalam keadaan hidup.
</div>

<button class="primary" id="btnConnect">1. Connect ke Printer</button>

<select id="charSelect" disabled>
  <option>— connect dulu untuk melihat daftar characteristic —</option>
</select>

<button class="secondary" id="btnTest" disabled>2. Kirim Test Print</button>
<button class="secondary" id="btnDisconnect" disabled>Disconnect</button>

<div id="log">Menunggu koneksi...\n</div>

<script>
const logEl = document.getElementById('log');
function log(msg) {
  logEl.textContent += msg + "\n";
  logEl.scrollTop = logEl.scrollHeight;
  console.log(msg);
}

// UUID service umum yang dipakai printer thermal BLE generik (ISSC/JDY UART,
// HM-10 style, Nordic UART, dan beberapa varian lain yang sering dipakai
// clone printer RPP02N/Goojprt/Iware). Kita daftar semuanya di optionalServices
// supaya Chrome mengizinkan kita membaca GATT table-nya walau kita belum tahu
// yang mana yang benar.
const CANDIDATE_SERVICES = [
  '49535343-fe7d-4ae5-8fa9-9fafd205e455', // ISSC UART (paling umum di printer 58mm Cina)
  '0000ffe0-0000-1000-8000-00805f9b34fb', // HM-10 style
  '0000ff00-0000-1000-8000-00805f9b34fb', // generic
  '000018f0-0000-1000-8000-00805f9b34fb', // generic printer service
  '6e400001-b5a3-f393-e0a9-e50e24dcca9e', // Nordic UART
  'e7810a71-73ae-499d-8c15-faa9aef0c3f2', // dipakai beberapa printer label kecil
  '00001800-0000-1000-8000-00805f9b34fb',
  '00001801-0000-1000-8000-00805f9b34fb',
  '0000180a-0000-1000-8000-00805f9b34fb',
];

let device, server, writableCharacteristics = [];

document.getElementById('btnConnect').addEventListener('click', async () => {
  if (!('bluetooth' in navigator)) {
    log('❌ Web Bluetooth tidak didukung. Pastikan pakai Chrome untuk Android.');
    return;
  }
  try {
    log('Membuka dialog pilih perangkat Bluetooth...');
    device = await navigator.bluetooth.requestDevice({
      acceptAllDevices: true,
      optionalServices: CANDIDATE_SERVICES,
    });
    log(`Dipilih: ${device.name || '(tanpa nama)'} [${device.id}]`);

    device.addEventListener('gattserverdisconnected', () => log('⚠️ Printer terputus.'));

    server = await device.gatt.connect();
    log('✅ Terhubung ke GATT server.');

    const services = await server.getPrimaryServices();
    log(`Ditemukan ${services.length} service.`);
    writableCharacteristics = [];

    for (const service of services) {
      log(`\n▶ Service: ${service.uuid}`);
      let chars;
      try { chars = await service.getCharacteristics(); }
      catch (e) { log(`  (gagal baca characteristics: ${e.message})`); continue; }

      for (const c of chars) {
        const props = Object.entries(c.properties).filter(([k,v]) => v).map(([k]) => k).join(', ');
        log(`  • ${c.uuid}  [${props}]`);
        if (c.properties.write || c.properties.writeWithoutResponse) {
          writableCharacteristics.push(c);
        }
      }
    }

    const sel = document.getElementById('charSelect');
    sel.innerHTML = '';
    if (writableCharacteristics.length === 0) {
      sel.innerHTML = '<option>Tidak ada characteristic yang bisa ditulis ditemukan</option>';
      log('\n❌ Tidak ada characteristic writable. Coba service UUID lain / cek app resmi printer untuk info lebih lanjut.');
    } else {
      writableCharacteristics.forEach((c, i) => {
        const opt = document.createElement('option');
        opt.value = i;
        opt.textContent = `${c.service.uuid.slice(0,8)}… / ${c.uuid}`;
        sel.appendChild(opt);
      });
      sel.disabled = false;
      document.getElementById('btnTest').disabled = false;
      log(`\n✅ ${writableCharacteristics.length} characteristic writable ditemukan. Pilih salah satu lalu tekan "Kirim Test Print".`);
    }
    document.getElementById('btnDisconnect').disabled = false;
  } catch (err) {
    log('❌ Error: ' + err.message);
  }
});

document.getElementById('btnTest').addEventListener('click', async () => {
  const idx = Number(document.getElementById('charSelect').value);
  const char = writableCharacteristics[idx];
  if (!char) return;

  // Perintah ESC/POS dasar: ESC @ (inisialisasi/reset), lalu teks, lalu beberapa line feed.
  const encoder = new TextEncoder();
  const init = new Uint8Array([0x1B, 0x40]); // ESC @
  const text = encoder.encode('KIRAKIRA STUDIO\nTEST PRINT OK\n\n\n\n');
  const payload = new Uint8Array([...init, ...text]);

  try {
    log(`\nMengirim ${payload.length} byte ke ${char.uuid}...`);
    // Kirim per-chunk (beberapa printer BLE punya batas MTU ~20-180 byte per write)
    const CHUNK = 100;
    for (let i = 0; i < payload.length; i += CHUNK) {
      const chunk = payload.slice(i, i + CHUNK);
      if (char.properties.writeWithoutResponse) {
        await char.writeValueWithoutResponse(chunk);
      } else {
        await char.writeValue(chunk);
      }
      await new Promise(r => setTimeout(r, 30));
    }
    log('✅ Data terkirim. Cek printer — apakah keluar kertas dengan tulisan "TEST PRINT OK"?');
  } catch (err) {
    log('❌ Gagal kirim: ' + err.message);
  }
});

document.getElementById('btnDisconnect').addEventListener('click', () => {
  if (device && device.gatt.connected) device.gatt.disconnect();
  document.getElementById('btnTest').disabled = true;
  document.getElementById('btnDisconnect').disabled = true;
  log('Diputus manual.');
});
</script>
</body>
</html>
