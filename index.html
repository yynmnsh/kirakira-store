// page: Login
// ============================================================================
function Login() {
  const { user, loading, login } = useAuth();
  const [email, setEmail] = useState("");
  const [password, setPassword] = useState("");
  const [error, setError] = useState("");
  const [submitting, setSubmitting] = useState(false);

  if (!loading && user) return <Navigate to="/" replace />;

  async function handleSubmit(ev) {
    ev.preventDefault();
    setError(""); setSubmitting(true);
    try { await login(email.trim(), password); }
    catch (err) { setError(friendlyAuthError(err.code)); }
    finally { setSubmitting(false); }
  }

  return (
    <div className="login-screen">
      <div className="login-card">
        <h1>Kirakira Studio</h1>
        <div className="jp">キラキラ</div>
        <div className="motto">Pretty Things for Everyday</div>
        <form onSubmit={handleSubmit}>
          <div className="field">
            <label htmlFor="email">Email</label>
            <input id="email" type="email" autoComplete="username" value={email} onChange={(ev) => setEmail(ev.target.value)} required />
          </div>
          <div className="field">
            <label htmlFor="password">Password</label>
            <input id="password" type="password" autoComplete="current-password" value={password} onChange={(ev) => setPassword(ev.target.value)} required />
          </div>
          {error && <div className="form-error">{error}</div>}
          <button className="btn btn-primary btn-block" type="submit" disabled={submitting}>{submitting ? "Signing in…" : "Sign in"}</button>
        </form>
      </div>
    </div>
  );
}

function friendlyAuthError(code) {
  switch (code) {
    case "auth/invalid-credential":
    case "auth/wrong-password":
    case "auth/user-not-found":
      return "Email or password is incorrect.";
    case "auth/too-many-requests":
      return "Too many attempts. Please wait a moment and try again.";
    default:
      return "Could not sign in. Please try again.";
  }
}

// ============================================================================
// page: POS
// ============================================================================
const CASH_QUICK_BUMPS = [0, 5000, 10000, 20000, 50000];

function POS() {
  const { user, profile, isManager } = useAuth();
  const [scanning, setScanning] = useState(false);
  const [manualCode, setManualCode] = useState("");
  const [cart, setCart] = useState([]);
  const [toast, setToast] = useState("");
  const [paymentMethod, setPaymentMethod] = useState("Cash");
  const [amountReceivedInput, setAmountReceivedInput] = useState("");
  const [checkingOut, setCheckingOut] = useState(false);
  const [lastSale, setLastSale] = useState(null);
  const [allProducts, setAllProducts] = useState([]);
  const [suggestOpen, setSuggestOpen] = useState(false);

  const [discountType, setDiscountType] = useState("none");
  const [discountValue, setDiscountValue] = useState("");
  const [maxStaffDiscount, setMaxStaffDiscount] = useState(10);
  const [approval, setApproval] = useState(null);
  const [approvalModalOpen, setApprovalModalOpen] = useState(false);
  const [approvalEmail, setApprovalEmail] = useState("");
  const [approvalPassword, setApprovalPassword] = useState("");
  const [approvalError, setApprovalError] = useState("");
  const [approving, setApproving] = useState(false);

  const [reprintOpen, setReprintOpen] = useState(false);
  const [reprintSales, setReprintSales] = useState([]);
  const [reprintLoading, setReprintLoading] = useState(false);
  const [reprintSearch, setReprintSearch] = useState("");
  const [reprintSale, setReprintSale] = useState(null);

  useEffect(() => {
    listProducts().then(setAllProducts).catch(() => {});
    getSettings().then((s) => setMaxStaffDiscount(s.staffMaxDiscountPercent)).catch(() => {});
  }, []);
  useEffect(() => { if (!toast) return; const t = setTimeout(() => setToast(""), 2200); return () => clearTimeout(t); }, [toast]);
  useEffect(() => { setApproval(null); }, [discountType, discountValue]);

  const subtotal = useMemo(() => cart.reduce((s, it) => s + it.listPrice * it.qty, 0), [cart]);
  const productDiscountTotal = useMemo(() => cart.reduce((s, it) => s + (it.listPrice - it.unitPrice) * it.qty, 0), [cart]);
  const afterProductDiscount = subtotal - productDiscountTotal;

  const transactionDiscountAmount = useMemo(() => {
    const value = Number(discountValue) || 0;
    if (discountType === "none" || value <= 0) return 0;
    const amt = discountType === "percent" ? Math.round(afterProductDiscount * (value / 100)) : value;
    return Math.max(0, Math.min(amt, afterProductDiscount));
  }, [discountType, discountValue, afterProductDiscount]);

  const effectiveDiscountPercent = afterProductDiscount > 0 ? (transactionDiscountAmount / afterProductDiscount) * 100 : 0;
  const needsApproval = !isManager && discountType !== "none" && Number(discountValue) > 0 && effectiveDiscountPercent > maxStaffDiscount;
  const canCheckoutDiscount = !needsApproval || !!approval;

  const total = afterProductDiscount - transactionDiscountAmount;
  const amountReceived = paymentMethod === "Cash" ? (Number(amountReceivedInput) || 0) : total;
  const changeGiven = paymentMethod === "Cash" ? Math.max(0, amountReceived - total) : 0;
  const cashShort = paymentMethod === "Cash" && amountReceivedInput !== "" && amountReceived < total;

  async function addBySku(sku) {
    if (!sku) return;
    const product = await findProductBySku(sku.trim());
    if (!product) { setToast(`No product found for SKU "${sku}"`); return; }
    addToCart(product);
  }

  function addToCart(product) {
    const { unitPrice } = getEffectivePrice(product);
    setCart((prev) => {
      const existing = prev.find((it) => it.productId === product.id);
      if (existing) {
        if (existing.qty >= product.stock) { setToast(`Only ${product.stock} left in stock for ${product.name}`); return prev; }
        return prev.map((it) => it.productId === product.id ? { ...it, qty: it.qty + 1 } : it);
      }
      if (product.stock <= 0) { setToast(`${product.name} is out of stock`); return prev; }
      return [...prev, {
        productId: product.id, sku: product.sku, name: product.name,
        listPrice: product.price, unitPrice, cost: product.cost ?? 0, qty: 1, stock: product.stock,
      }];
    });
    setToast(`Added ${product.name}`);
  }

  function changeQty(productId, delta) {
    setCart((prev) => prev.map((it) => it.productId === productId ? { ...it, qty: Math.min(it.stock, Math.max(1, it.qty + delta)) } : it));
  }
  function removeLine(productId) { setCart((prev) => prev.filter((it) => it.productId !== productId)); }

  async function handleManualSubmit(ev) { ev.preventDefault(); await addBySku(manualCode); setManualCode(""); }

  function resetDiscount() { setDiscountType("none"); setDiscountValue(""); setApproval(null); }

  async function submitApproval(ev) {
    ev.preventDefault(); setApproving(true); setApprovalError("");
    try {
      const result = await verifyManagerCredentials(approvalEmail, approvalPassword);
      if (result.ok) {
        setApproval({ managerName: result.name }); setApprovalModalOpen(false);
        setApprovalEmail(""); setApprovalPassword(""); setToast(`Discount approved by ${result.name}`);
      } else {
        setApprovalError(result.error === "NOT_A_MANAGER" ? "That account is not a manager." : "Incorrect email or password.");
      }
    } finally { setApproving(false); }
  }

  async function handleCheckout() {
    if (cart.length === 0) return;
    if (!canCheckoutDiscount) { setToast("This discount needs manager approval first."); return; }
    if (cashShort) { setToast("Amount received is less than the total."); return; }
    setCheckingOut(true);
    try {
      const transactionDiscount = transactionDiscountAmount > 0
        ? { type: discountType, value: Number(discountValue) || 0, amount: transactionDiscountAmount } : null;
      const items = cart.map(({ productId, sku, name, listPrice, unitPrice, cost, qty }) => ({ productId, sku, name, listPrice, unitPrice, cost, qty }));
      const { receiptNo } = await createSale({
        items, subtotal, productDiscountTotal, transactionDiscount, total,
        paymentMethod, amountReceived, changeGiven, discountApproval: approval,
        cashierUid: user.uid, cashierName: profile?.name ?? user.email,
      });
      const sale = {
        receiptNo, items, subtotal, productDiscountTotal, transactionDiscount, total,
        paymentMethod, amountReceived, changeGiven, discountApproval: approval,
        cashierName: profile?.name ?? user.email, createdAt: new Date(),
      };
      setLastSale(sale); setCart([]); resetDiscount(); setAmountReceivedInput("");
      setAllProducts((prev) => prev.map((p) => {
        const line = sale.items.find((it) => it.productId === p.id);
        return line ? { ...p, stock: p.stock - line.qty } : p;
      }));
      setTimeout(() => window.print(), 150);
    } catch (err) { setToast(err.message ?? "Checkout failed"); } finally { setCheckingOut(false); }
  }

  async function openReprint() {
    setReprintOpen((v) => !v);
    if (!reprintOpen && reprintSales.length === 0) {
      setReprintLoading(true);
      const from = new Date(); from.setDate(from.getDate() - 30);
      const s = await listSales(isManager ? { from } : { from, cashierUid: user.uid });
      setReprintSales(s); setReprintLoading(false);
    }
  }
  function printReprint(sale) { setReprintSale(sale); setTimeout(() => window.print(), 150); }

  const suggestions = manualCode.length > 0
    ? allProducts.filter((p) => p.sku.toLowerCase().includes(manualCode.toLowerCase()) || p.name.toLowerCase().includes(manualCode.toLowerCase())).slice(0, 6)
    : [];
  const filteredReprintSales = reprintSales.filter((s) => !reprintSearch || s.receiptNo.toLowerCase().includes(reprintSearch.toLowerCase()));

  return (
    <div>
      <div className="page-header no-print">
        <div>
          <h2>Point of Sale</h2>
          <div className="subtitle">Scan a barcode or search by name / SKU to build a sale.</div>
        </div>
        <button className="btn btn-outline btn-sm" onClick={openReprint}>🔎 {reprintOpen ? "Hide" : "Reprint a past receipt"}</button>
      </div>

      {reprintOpen && (
        <div className="card no-print" style={{ marginBottom: 20 }}>
          <div className="toolbar" style={{ marginBottom: 10 }}>
            <input type="text" placeholder="Search receipt no…" value={reprintSearch} onChange={(ev) => setReprintSearch(ev.target.value)} />
          </div>
          {reprintLoading ? <div className="empty-state">Loading…</div> : filteredReprintSales.length === 0 ? (
            <div className="empty-state">No sales found in the last 30 days.</div>
          ) : (
            <table>
              <thead><tr><th>Receipt</th><th>Date</th><th>Total</th><th></th></tr></thead>
              <tbody>
                {filteredReprintSales.slice(0, 20).map((s) => (
                  <tr key={s.id}>
                    <td className="mono">{s.receiptNo}</td>
                    <td>{s.createdAt.toLocaleString("id-ID")}</td>
                    <td className="mono">{formatIDR(s.total)}</td>
                    <td><button className="btn btn-secondary btn-sm" onClick={() => printReprint(s)}>Print</button></td>
                  </tr>
                ))}
              </tbody>
            </table>
          )}
        </div>
      )}

      <div className="pos-layout no-print">
        <div className="card">
          <div className="pos-scan-row">
            <button className="btn btn-primary" onClick={() => setScanning((s) => !s)}>{scanning ? "✕ Stop camera" : "📷 Scan barcode"}</button>
            <form onSubmit={handleManualSubmit} style={{ flex: 1, position: "relative" }}>
              <input type="text" placeholder="Or type SKU / product name…" value={manualCode}
                onChange={(ev) => { setManualCode(ev.target.value); setSuggestOpen(true); }}
                onBlur={() => setTimeout(() => setSuggestOpen(false), 150)} style={{ width: "100%" }} />
              {suggestOpen && suggestions.length > 0 && (
                <div className="card" style={{ position: "absolute", top: "110%", left: 0, right: 0, zIndex: 10, padding: 6 }}>
                  {suggestions.map((p) => (
                    <div key={p.id} style={{ padding: "8px 10px", cursor: "pointer", borderRadius: 8, display: "flex", justifyContent: "space-between" }}
                      onMouseDown={() => { addToCart(p); setManualCode(""); setSuggestOpen(false); }}>
                      <span>{p.name}</span>
                      <span className="mono" style={{ color: "var(--ink-faint)" }}>{p.sku}</span>
                    </div>
                  ))}
                </div>
              )}
            </form>
          </div>

          {scanning && <BarcodeScanner onDetect={(code) => addBySku(code)} onError={() => setToast("Camera unavailable — check browser permissions.")} />}

          <div className="card-title" style={{ marginTop: 12 }}>Cart</div>
          {cart.length === 0 ? (
            <div className="empty-state">Cart is empty. Scan or search a product to begin.</div>
          ) : (
            <div>
              {cart.map((it) => (
                <div className="cart-line" key={it.productId}>
                  <div className="info">
                    <div className="name">{it.name}</div>
                    <div className="sku">
                      {it.sku} · {formatIDR(it.unitPrice)}
                      {it.unitPrice < it.listPrice && <span style={{ textDecoration: "line-through", marginLeft: 6 }}>{formatIDR(it.listPrice)}</span>}
                    </div>
                  </div>
                  <div className="qty-control">
                    <button onClick={() => changeQty(it.productId, -1)}>−</button>
                    <span className="mono">{it.qty}</span>
                    <button onClick={() => changeQty(it.productId, 1)}>+</button>
                  </div>
                  <div className="mono" style={{ width: 90, textAlign: "right" }}>{formatIDR(it.unitPrice * it.qty)}</div>
                  <button className="icon-btn" onClick={() => removeLine(it.productId)}>✕</button>
                </div>
              ))}

              <div className="field-row" style={{ marginTop: 16 }}>
                <div className="field">
                  <label>Transaction discount</label>
                  <select value={discountType} onChange={(ev) => setDiscountType(ev.target.value)}>
                    <option value="none">None</option>
                    <option value="percent">Percent off</option>
                    <option value="amount">Amount off</option>
                  </select>
                </div>
                {discountType !== "none" && (
                  <div className="field">
                    <label>{discountType === "percent" ? "Percent (%)" : "Amount (IDR)"}</label>
                    <NumberInput value={discountValue} onChange={setDiscountValue} placeholder="0" />
                  </div>
                )}
              </div>
              {needsApproval && !approval && (
                <div className="form-error" style={{ marginTop: -6 }}>
                  This exceeds your {maxStaffDiscount}% limit — needs manager approval.
                  <div style={{ marginTop: 6 }}>
                    <button type="button" className="btn btn-lavender btn-sm" onClick={() => setApprovalModalOpen(true)}>Get manager approval</button>
                  </div>
                </div>
              )}
              {approval && <div style={{ fontSize: 12, color: "var(--mint)", marginTop: -6, marginBottom: 10 }}>✓ Approved by {approval.managerName}</div>}

              <div className="cart-total-row" style={{ flexDirection: "column", alignItems: "stretch", gap: 4 }}>
                <div style={{ display: "flex", justifyContent: "space-between", fontSize: 13, color: "var(--ink-soft)" }}>
                  <span>Subtotal</span><span className="mono">{formatIDR(subtotal)}</span>
                </div>
                {productDiscountTotal > 0 && (
                  <div style={{ display: "flex", justifyContent: "space-between", fontSize: 13, color: "var(--ink-soft)" }}>
                    <span>Product discounts</span><span className="mono">-{formatIDR(productDiscountTotal)}</span>
                  </div>
                )}
                {transactionDiscountAmount > 0 && (
                  <div style={{ display: "flex", justifyContent: "space-between", fontSize: 13, color: "var(--ink-soft)" }}>
                    <span>Transaction discount</span><span className="mono">-{formatIDR(transactionDiscountAmount)}</span>
                  </div>
                )}
                <div style={{ display: "flex", justifyContent: "space-between", paddingTop: 8, borderTop: "2px dashed var(--border)", marginTop: 4 }}>
                  <span>Total</span><span className="amount">{formatIDR(total)}</span>
                </div>
              </div>

              <div className="field" style={{ marginTop: 16 }}>
                <label>Payment method</label>
                <select value={paymentMethod} onChange={(ev) => setPaymentMethod(ev.target.value)}>
                  <option>Cash</option>
                  <option>QRIS</option>
                  <option>Bank Transfer</option>
                </select>
              </div>

              {paymentMethod === "Cash" && (
                <div className="field">
                  <label>Amount received</label>
                  <NumberInput value={amountReceivedInput} onChange={setAmountReceivedInput} placeholder={String(total)} />
                  <div style={{ display: "flex", gap: 6, flexWrap: "wrap", marginTop: 6 }}>
                    <button type="button" className="btn btn-secondary btn-sm" onClick={() => setAmountReceivedInput(String(total))}>Pas</button>
                    {CASH_QUICK_BUMPS.filter((b) => b > 0).map((bump) => (
                      <button key={bump} type="button" className="btn btn-secondary btn-sm"
                        onClick={() => setAmountReceivedInput(String(Math.ceil(total / bump) * bump))}>
                        Round {formatIDR(bump)}
                      </button>
                    ))}
                  </div>
                  {amountReceivedInput !== "" && (
                    <div style={{ marginTop: 8, fontSize: 14, fontWeight: 600, color: cashShort ? "var(--danger)" : "var(--mint)" }}>
                      {cashShort ? `Short by ${formatIDR(total - amountReceived)}` : `Kembalian: ${formatIDR(changeGiven)}`}
                    </div>
                  )}
                </div>
              )}

              <button className="btn btn-primary btn-block" disabled={checkingOut || !canCheckoutDiscount || cashShort} onClick={handleCheckout}>
                {checkingOut ? "Processing…" : "Checkout & Print Receipt"}
              </button>
            </div>
          )}
        </div>

        <div className="card">
          <div className="card-title">Receipt preview</div>
          {lastSale ? (
            <>
              <ReceiptPreview sale={lastSale} />
              <div style={{ display: "flex", gap: 8, marginTop: 12 }}>
                <button className="btn btn-secondary" style={{ flex: 1 }} onClick={() => window.print()}>🖨️ Print again</button>
                <button className="btn btn-primary" style={{ flex: 1 }} onClick={() => setLastSale(null)}>+ New sale</button>
              </div>
            </>
          ) : <div className="empty-state">The last completed sale will preview here.</div>}
        </div>
      </div>

      {lastSale && <ReceiptPrintable sale={lastSale} />}
      {reprintSale && <ReceiptPrintable sale={reprintSale} />}
      {toast && <div className="toast no-print">{toast}</div>}

      {approvalModalOpen && (
        <div className="modal-overlay no-print" onMouseDown={(ev) => ev.target === ev.currentTarget && setApprovalModalOpen(false)}>
          <div className="modal">
            <div className="modal-header">
              <h3>Manager approval</h3>
              <button className="icon-btn" onClick={() => setApprovalModalOpen(false)}>✕</button>
            </div>
            <p style={{ fontSize: 13, color: "var(--ink-soft)", marginBottom: 14 }}>A manager needs to sign in here to authorize this discount. This won't sign you out.</p>
            <form onSubmit={submitApproval}>
              <div className="field">
                <label>Manager email</label>
                <input type="email" value={approvalEmail} onChange={(ev) => setApprovalEmail(ev.target.value)} required />
              </div>
              <div className="field">
                <label>Manager password</label>
                <input type="password" value={approvalPassword} onChange={(ev) => setApprovalPassword(ev.target.value)} required />
              </div>
              {approvalError && <div className="form-error">{approvalError}</div>}
              <div style={{ display: "flex", gap: 10 }}>
                <button type="button" className="btn btn-secondary" onClick={() => setApprovalModalOpen(false)}>Cancel</button>
                <button type="submit" className="btn btn-primary" disabled={approving}>{approving ? "Checking…" : "Approve"}</button>
              </div>
            </form>
          </div>
        </div>
      )}
    </div>
  );
}

// page: Inventory

function Inventory() {
  const { user, profile, isManager } = useAuth();
  const [products, setProducts] = useState([]);
  const [loading, setLoading] = useState(true);
  const [search, setSearch] = useState("");
  const [category, setCategory] = useState("All");
  const [editing, setEditing] = useState(null);
  const [toast, setToast] = useState("");

  async function refresh() {
    setLoading(true);
    try { setProducts(await listProducts()); } finally { setLoading(false); }
  }
  useEffect(() => { refresh(); }, []);
  useEffect(() => { if (!toast) return; const t = setTimeout(() => setToast(""), 2000); return () => clearTimeout(t); }, [toast]);

  const categories = useMemo(() => ["All", ...new Set(products.map((p) => p.category))], [products]);
  const filtered = products.filter((p) => {
    const matchesSearch = !search || p.name.toLowerCase().includes(search.toLowerCase()) || p.sku.toLowerCase().includes(search.toLowerCase());
    const matchesCategory = category === "All" || p.category === category;
    return matchesSearch && matchesCategory;
  });

  async function handleSave(data) {
    if (editing?.id) {
      await updateProduct(editing.id, data, { uid: user.uid, name: profile?.name ?? user.email });
      setToast("Product updated");
    } else {
      await createProduct(data);
      setToast("Product added");
    }
    setEditing(null); refresh();
  }

  async function handleDelete(product) {
    if (!confirm(`Delete "${product.name}"? This cannot be undone.`)) return;
    await deleteProduct(product.id); setToast("Product deleted"); refresh();
  }

  return (
    <div>
      <div className="page-header">
        <div><h2>Inventory</h2><div className="subtitle">{products.length} products tracked</div></div>
        {isManager && <button className="btn btn-primary" onClick={() => setEditing({})}>+ Add product</button>}
      </div>

      <div className="toolbar">
        <input type="text" placeholder="Search name or SKU…" value={search} onChange={(ev) => setSearch(ev.target.value)} />
        <select value={category} onChange={(ev) => setCategory(ev.target.value)}>{categories.map((c) => <option key={c}>{c}</option>)}</select>
        <div className="spacer" />
      </div>

      <div className="table-wrap">
        <table>
          <thead>
            <tr><th>SKU</th><th>Name</th><th>Category</th><th>Price</th><th>Stock</th><th>Status</th>{isManager && <th></th>}</tr>
          </thead>
          <tbody>
            {loading && <tr><td colSpan={7} style={{ textAlign: "center", padding: 32, color: "var(--ink-soft)" }}>Loading inventory…</td></tr>}
            {!loading && filtered.length === 0 && <tr><td colSpan={7}><div className="empty-state">No products match your search.</div></td></tr>}
            {filtered.map((p) => {
              const status = stockStatus(p);
              const { isDiscounted, unitPrice } = getEffectivePrice(p);
              return (
                <tr key={p.id}>
                  <td className="mono">{p.sku}</td>
                  <td>{p.name}</td>
                  <td>{p.category}</td>
                  <td className="mono">
                    {isDiscounted ? (
                      <>
                        <span style={{ textDecoration: "line-through", color: "var(--ink-faint)", marginRight: 6 }}>{formatIDR(p.price)}</span>
                        <span style={{ color: "var(--accent)", fontWeight: 700 }}>{formatIDR(unitPrice)}</span>
                      </>
                    ) : formatIDR(p.price)}
                  </td>
                  <td className="mono">{p.stock.toLocaleString("id-ID")}</td>
                  <td><span className={`badge ${status}`}>{status === "ok" ? "In stock" : status === "low" ? "Low stock" : "Out of stock"}</span></td>
                  {isManager && (
                    <td>
                      <div style={{ display: "flex", gap: 6, justifyContent: "flex-end" }}>
                        <button className="btn btn-secondary btn-sm" onClick={() => setEditing(p)}>Edit</button>
                        <button className="btn btn-danger btn-sm" onClick={() => handleDelete(p)}>Delete</button>
                      </div>
                    </td>
                  )}
                </tr>
              );
            })}
          </tbody>
        </table>
      </div>

      {editing !== null && (
        <ProductForm initial={editing.id ? editing : null} onSave={handleSave} onClose={() => setEditing(null)} onDuplicate={(existing) => setEditing(existing)} />
      )}
      {toast && <div className="toast">{toast}</div>}
    </div>
  );
}

// ============================================================================
// page: Shift
// ============================================================================
function Shift() {
  const { user, profile, isManager } = useAuth();
  const [shift, setShift] = useState(undefined);
  const [openingCash, setOpeningCash] = useState("");
  const [actualCash, setActualCash] = useState("");
  const [live, setLive] = useState(null);
  const [closing, setClosing] = useState(false);
  const [result, setResult] = useState(null);
  const [toast, setToast] = useState("");
  const [history, setHistory] = useState([]);

  async function refresh() {
    try {
      const s = await getOpenShift(user.uid);
      setShift(s);
      if (s) setLive(await computeExpectedCash(s));
      setHistory(isManager ? await listShifts({}) : await listShifts({ staffUid: user.uid }));
    } catch (err) {
      setShift(null);
      setToast(err.message ?? "Could not load shift data. Check your Firestore rules & indexes.");
    }
  }
  useEffect(() => { refresh(); }, []);
  useEffect(() => { if (!toast) return; const t = setTimeout(() => setToast(""), 2200); return () => clearTimeout(t); }, [toast]);

  async function handleOpen(ev) {
    ev.preventDefault();
    await openShift({ uid: user.uid, name: profile?.name ?? user.email, openingCash: Number(openingCash) || 0 });
    setOpeningCash(""); setToast("Shift opened"); refresh();
  }

  async function handleClose(ev) {
    ev.preventDefault(); setClosing(true);
    try {
      const r = await closeShift(shift, { actualCash: Number(actualCash) || 0 });
      setResult(r); setToast("Shift closed"); setActualCash(""); refresh();
    } finally { setClosing(false); }
  }

  if (shift === undefined) return <div className="empty-state">Loading…</div>;

  return (
    <div>
      <div className="page-header">
        <div><h2>Cash Shift</h2><div className="subtitle">Track a starting cash float and reconcile it at the end of your shift.</div></div>
      </div>

      {!shift ? (
        <div className="card" style={{ maxWidth: 420 }}>
          <div className="card-title">Open a shift</div>
          <form onSubmit={handleOpen}>
            <div className="field"><label>Starting cash in drawer</label><NumberInput value={openingCash} onChange={setOpeningCash} placeholder="0" /></div>
            <button className="btn btn-primary btn-block" type="submit">Open shift</button>
          </form>
        </div>
      ) : (
        <div className="card" style={{ maxWidth: 480, marginBottom: 24 }}>
          <div className="card-title">Shift in progress — since {shift.openedAt.toLocaleString("id-ID")}</div>
          {live && (
            <div style={{ display: "flex", flexDirection: "column", gap: 6, fontSize: 14, marginBottom: 16 }}>
              <div style={{ display: "flex", justifyContent: "space-between" }}><span>Opening cash</span><span className="mono">{formatIDR(live.openingCash)}</span></div>
              <div style={{ display: "flex", justifyContent: "space-between" }}><span>Cash sales so far</span><span className="mono">+{formatIDR(live.cashSalesTotal)}</span></div>
              {live.cashVoidsTotal > 0 && <div style={{ display: "flex", justifyContent: "space-between" }}><span>Cash voids</span><span className="mono">-{formatIDR(live.cashVoidsTotal)}</span></div>}
              <div style={{ display: "flex", justifyContent: "space-between", paddingTop: 8, borderTop: "2px dashed var(--border)", fontWeight: 700 }}>
                <span>Expected cash now</span><span className="mono">{formatIDR(live.expectedCash)}</span>
              </div>
            </div>
          )}
          <form onSubmit={handleClose}>
            <div className="field"><label>Actual cash counted (to close shift)</label><NumberInput value={actualCash} onChange={setActualCash} placeholder="0" /></div>
            <button className="btn btn-danger btn-block" type="submit" disabled={closing}>{closing ? "Closing…" : "Close shift"}</button>
          </form>
        </div>
      )}

      {result && (
        <div className="card" style={{ maxWidth: 480, marginBottom: 24, borderColor: result.variance === 0 ? "var(--mint)" : "var(--danger)" }}>
          <div className="card-title">Last shift result</div>
          <div style={{ fontSize: 14 }}>Expected: <span className="mono">{formatIDR(result.expectedCash)}</span></div>
          <div style={{ fontSize: 14, fontWeight: 700, color: result.variance === 0 ? "var(--mint)" : "var(--danger)" }}>
            {result.variance === 0 ? "Balanced ✓" : result.variance > 0 ? `Over by ${formatIDR(result.variance)}` : `Short by ${formatIDR(-result.variance)}`}
          </div>
        </div>
      )}

      <div className="card">
        <div className="card-title">{isManager ? "All shift history" : "My shift history"}</div>
        {history.length === 0 ? <div className="empty-state">No closed shifts yet.</div> : (
          <table>
            <thead><tr>{isManager && <th>Staff</th>}<th>Opened</th><th>Expected</th><th>Actual</th><th>Variance</th></tr></thead>
            <tbody>
              {history.filter((h) => h.status === "closed").map((h) => (
                <tr key={h.id}>
                  {isManager && <td>{h.staffName}</td>}
                  <td>{h.openedAt.toLocaleDateString("id-ID")}</td>
                  <td className="mono">{formatIDR(h.expectedCash ?? 0)}</td>
                  <td className="mono">{formatIDR(h.actualCash ?? 0)}</td>
                  <td><span className={`badge ${h.variance === 0 ? "ok" : "out"}`}>{h.variance > 0 ? `+${formatIDR(h.variance)}` : formatIDR(h.variance ?? 0)}</span></td>
                </tr>
              ))}
            </tbody>
          </table>
        )}
      </div>
      {toast && <div className="toast">{toast}</div>}
    </div>
  );
}

// ============================================================================
// small helper: lightweight bar chart (replaces recharts in the single-file
// build — recharts pulls in a large dependency tree that's fragile to load
// from a CDN with no bundler; a plain CSS bar chart is a fair trade for a
// single revenue-by-day view).
// ============================================================================
function SimpleBarChart({ data }) {
  const max = Math.max(1, ...data.map((d) => d.revenue));
  return (
    <div style={{ display: "flex", alignItems: "flex-end", gap: 4, height: 220, padding: "0 4px" }}>
      {data.map((d) => (
        <div key={d.date} style={{ flex: 1, display: "flex", flexDirection: "column", alignItems: "center", gap: 4 }}>
          <div style={{ fontSize: 10, color: "var(--ink-faint)" }}>{d.revenue > 0 ? Math.round(d.revenue / 1000) + "k" : ""}</div>
          <div title={formatIDR(d.revenue)} style={{
            width: "100%", background: "var(--accent)", borderRadius: "4px 4px 0 0",
            height: Math.max(2, (d.revenue / max) * 170),
          }} />
          <div style={{ fontSize: 10, color: "var(--ink-soft)" }}>{d.date}</div>
        </div>
      ))}
    </div>
  );
}

// ============================================================================
// page: AnalyticsManager
// ============================================================================
function AnalyticsManager() {
  const [preset, setPreset] = useState("30 days");
  const [custom, setCustom] = useState({});
  const [category, setCategory] = useState("All");
  const [staffName, setStaffName] = useState("All");

  const [sales, setSales] = useState([]);
  const [products, setProducts] = useState([]);
  const [corrections, setCorrections] = useState([]);
  const [adjustments, setAdjustments] = useState([]);
  const [loading, setLoading] = useState(true);

  useEffect(() => {
    const { from, to } = resolveRange(preset, custom);
    setLoading(true);
    Promise.all([
      listSales({ from, to }), listProducts(),
      listCorrections({ status: "approved" }), listAdjustments({ status: "approved" }),
    ]).then(([s, p, c, a]) => {
      const inRange = (d) => (!from || d >= from) && (!to || d <= to);
      setSales(s); setProducts(p);
      setCorrections(c.filter((x) => inRange(x.createdAt)));
      setAdjustments(a.filter((x) => inRange(x.createdAt)));
    }).finally(() => setLoading(false));
  }, [preset, custom.from, custom.to]);

  const categoryMap = useMemo(() => Object.fromEntries(products.map((p) => [p.sku, p.category])), [products]);
  const categories = useMemo(() => ["All", ...new Set(products.map((p) => p.category))], [products]);
  const staffNames = useMemo(() => ["All", ...new Set(sales.map((s) => s.cashierName))], [sales]);

  const lines = useMemo(() => sales.flatMap((s) =>
    s.items.map((it) => ({
      saleId: s.id, createdAt: s.createdAt, cashierName: s.cashierName,
      category: categoryMap[it.sku] ?? "Uncategorized", name: it.name,
      listPrice: it.listPrice, unitPrice: it.unitPrice, cost: it.cost, qty: it.qty,
    }))
  ), [sales, categoryMap]);

  const filteredLines = useMemo(() => lines.filter((l) =>
    (category === "All" || l.category === category) && (staffName === "All" || l.cashierName === staffName)
  ), [lines, category, staffName]);

  const stats = useMemo(() => computeAnalyticsStats(filteredLines), [filteredLines]);
  const paymentBreakdown = useMemo(
    () => computePaymentBreakdown(sales.filter((s) => staffName === "All" || s.cashierName === staffName)),
    [sales, staffName]
  );
  const lowStock = useMemo(() => products.filter((p) => stockStatus(p) !== "ok").sort((a, b) => a.stock - b.stock), [products]);

  const pl = useMemo(() => {
    const grossSales = sales.reduce((s, sale) => s + sale.subtotal, 0);
    const productDiscountTotal = sales.reduce((s, sale) => s + sale.productDiscountTotal, 0);
    const transactionDiscountTotal = sales.reduce((s, sale) => s + (sale.transactionDiscount?.amount ?? 0), 0);
    const netRevenue = sales.reduce((s, sale) => s + sale.total, 0);
    const cogs = lines.reduce((s, l) => s + l.cost * l.qty, 0);
    const grossProfit = netRevenue - cogs;
    const voidedRevenue = corrections.reduce((s, c) => s + c.total, 0);
    const voidedCogs = corrections.reduce((s, c) => s + (c.items ?? []).reduce((a, it) => a + (it.cost ?? 0) * it.qty, 0), 0);
    const voidedProfit = voidedRevenue - voidedCogs;
    const stockLossValue = adjustments.filter((a) => a.valuationTotal < 0).reduce((s, a) => s + Math.abs(a.valuationTotal), 0);
    const stockGainValue = adjustments.filter((a) => a.valuationTotal > 0).reduce((s, a) => s + a.valuationTotal, 0);
    const netRevenueAfterVoids = netRevenue - voidedRevenue;
    const netProfit = grossProfit - voidedProfit - stockLossValue + stockGainValue;
    return { grossSales, productDiscountTotal, transactionDiscountTotal, netRevenue, cogs, grossProfit, voidedRevenue, voidedProfit, stockLossValue, stockGainValue, netRevenueAfterVoids, netProfit };
  }, [sales, lines, corrections, adjustments]);

  return (
    <div>
      <div className="page-header">
        <div><h2>Analytics — Manager</h2><div className="subtitle">Store-wide performance, filterable by period, category, and staff</div></div>
      </div>

      <div className="card" style={{ marginBottom: 20 }}>
        <div className="toolbar" style={{ marginBottom: 0 }}>
          <DateRangeFilter preset={preset} onPresetChange={setPreset} custom={custom} onCustomChange={setCustom} />
          <select value={category} onChange={(ev) => setCategory(ev.target.value)}>{categories.map((c) => <option key={c}>{c}</option>)}</select>
          <select value={staffName} onChange={(ev) => setStaffName(ev.target.value)}>{staffNames.map((s) => <option key={s}>{s}</option>)}</select>
        </div>
      </div>

      {loading ? <div className="empty-state">Loading analytics…</div> : (
        <>
          <div className="stat-grid">
            <StatCard label="Revenue (filtered)" value={formatIDR(stats.totalRevenue)} />
            <StatCard label="Transactions" value={stats.txCount} />
            <StatCard label="Items sold" value={stats.itemsSold} />
            <StatCard label="Avg. basket" value={formatIDR(stats.avgBasket)} />
          </div>

          <div className="card" style={{ marginBottom: 24 }}>
            <div className="card-title">Profit &amp; Loss — whole store, this date range</div>
            <div style={{ fontSize: 13, color: "var(--ink-soft)", marginBottom: 12 }}>
              Cost figures use each product's cost (harga modal) at the moment it was sold, not today's cost. This card ignores the category/staff filters above — discounts and voids apply per-transaction, not per-item.
            </div>
            <PLTable rows={[
              ["Gross sales (harga jual, list price)", pl.grossSales],
              ["− Product discounts", -pl.productDiscountTotal, true],
              ["− Transaction discounts", -pl.transactionDiscountTotal, true],
              ["= Revenue", pl.netRevenue, false, true],
              ["− Cost of goods sold (harga modal)", -pl.cogs, true],
              ["= Gross profit", pl.grossProfit, false, true],
              ["− Voided sales (revenue)", -pl.voidedRevenue, true],
              ["− Voided profit", -pl.voidedProfit, true],
              ["− Stock losses (damaged / lost / opname)", -pl.stockLossValue, true],
              ["+ Stock gains (opname surplus)", pl.stockGainValue, true],
              ["= Net revenue after voids", pl.netRevenueAfterVoids, false, true],
              ["= Net profit", pl.netProfit, false, true],
            ]} />
          </div>

          <div className="card" style={{ marginBottom: 24 }}>
            <div className="card-title">Revenue by day{category !== "All" || staffName !== "All" ? " (filtered)" : ""}</div>
            <SimpleBarChart data={stats.byDay} />
          </div>

          <div className="two-col-grid">
            <div className="card">
              <div className="card-title">Top products{category !== "All" ? ` — ${category}` : ""}</div>
              {stats.topProducts.length === 0 ? <div className="empty-state">No sales in this filter.</div> : (
                <table>
                  <thead><tr><th>Product</th><th>Qty sold</th><th>Revenue</th><th>Profit</th></tr></thead>
                  <tbody>
                    {stats.topProducts.map((p) => (
                      <tr key={p.name}><td>{p.name}</td><td className="mono">{p.qty}</td><td className="mono">{formatIDR(p.revenue)}</td><td className="mono">{formatIDR(p.profit)}</td></tr>
                    ))}
                  </tbody>
                </table>
              )}
            </div>
            <div className="card">
              <div className="card-title">Sales by staff</div>
              <table>
                <thead><tr><th>Staff</th><th>Transactions</th><th>Revenue</th></tr></thead>
                <tbody>{stats.byStaff.map((s) => <tr key={s.name}><td>{s.name}</td><td className="mono">{s.count}</td><td className="mono">{formatIDR(s.revenue)}</td></tr>)}</tbody>
              </table>
            </div>
          </div>

          <div className="card" style={{ marginTop: 24 }}>
            <div className="card-title">Payment methods{staffName !== "All" ? ` — ${staffName}` : ""}</div>
            {paymentBreakdown.length === 0 ? <div className="empty-state">No sales in this filter.</div> : (
              <table>
                <thead><tr><th>Method</th><th>Transactions</th><th>Revenue</th></tr></thead>
                <tbody>{paymentBreakdown.map((p) => <tr key={p.method}><td>{p.method}</td><td className="mono">{p.count}</td><td className="mono">{formatIDR(p.revenue)}</td></tr>)}</tbody>
              </table>
            )}
          </div>

          <div className="card" style={{ marginTop: 24 }}>
            <div className="card-title">Stock alerts</div>
            {lowStock.length === 0 ? <div className="empty-state">All products are healthily stocked.</div> : (
              <table>
                <thead><tr><th>SKU</th><th>Product</th><th>Stock left</th><th>Status</th></tr></thead>
                <tbody>
                  {lowStock.map((p) => (
                    <tr key={p.id}>
                      <td className="mono">{p.sku}</td><td>{p.name}</td><td className="mono">{p.stock}</td>
                      <td><span className={`badge ${stockStatus(p)}`}>{stockStatus(p) === "low" ? "Low stock" : "Out of stock"}</span></td>
                    </tr>
                  ))}
                </tbody>
              </table>
            )}
          </div>
        </>
      )}
    </div>
  );
}

function StatCard({ label, value }) {
  return <div className="stat-card"><div className="label">{label}</div><div className="value">{value}</div></div>;
}
function PLTable({ rows }) {
  return (
    <table>
      <tbody>
        {rows.map(([label, value, muted, strong], i) => (
          <tr key={i} style={strong ? { fontWeight: 700 } : undefined}>
            <td style={{ color: muted ? "var(--ink-soft)" : "var(--ink)", paddingLeft: muted ? 24 : undefined }}>{label}</td>
            <td className="mono" style={{ textAlign: "right", color: value < 0 ? "var(--danger)" : undefined }}>{formatIDR(value)}</td>
          </tr>
        ))}
      </tbody>
    </table>
  );
}

function computeAnalyticsStats(lines) {
  const totalRevenue = lines.reduce((s, l) => s + l.unitPrice * l.qty, 0);
  const itemsSold = lines.reduce((s, l) => s + l.qty, 0);
  const txCount = new Set(lines.map((l) => l.saleId)).size;
  const avgBasket = txCount ? totalRevenue / txCount : 0;

  const byDayMap = new Map();
  lines.forEach((l) => { const key = l.createdAt.toLocaleDateString("en-CA"); byDayMap.set(key, (byDayMap.get(key) || 0) + l.unitPrice * l.qty); });
  const byDay = [...byDayMap.entries()].sort(([a], [b]) => a.localeCompare(b)).map(([date, revenue]) => ({ date: date.slice(5), revenue }));

  const productMap = new Map();
  lines.forEach((l) => {
    const cur = productMap.get(l.name) || { name: l.name, qty: 0, revenue: 0, profit: 0 };
    cur.qty += l.qty; cur.revenue += l.unitPrice * l.qty; cur.profit += (l.unitPrice - l.cost) * l.qty;
    productMap.set(l.name, cur);
  });
  const topProducts = [...productMap.values()].sort((a, b) => b.revenue - a.revenue).slice(0, 8);

  const staffMap = new Map();
  lines.forEach((l) => {
    const cur = staffMap.get(l.cashierName) || { name: l.cashierName, saleIds: new Set(), revenue: 0 };
    cur.saleIds.add(l.saleId); cur.revenue += l.unitPrice * l.qty;
    staffMap.set(l.cashierName, cur);
  });
  const byStaff = [...staffMap.values()].map((s) => ({ name: s.name, count: s.saleIds.size, revenue: s.revenue })).sort((a, b) => b.revenue - a.revenue);

  return { totalRevenue, txCount, itemsSold, avgBasket, byDay, topProducts, byStaff };
}

function computePaymentBreakdown(sales) {
  const map = new Map();
  sales.forEach((s) => {
    const cur = map.get(s.paymentMethod) || { method: s.paymentMethod, count: 0, revenue: 0 };
    cur.count += 1; cur.revenue += s.total;
    map.set(s.paymentMethod, cur);
  });
  return [...map.values()].sort((a, b) => b.revenue - a.revenue);
}

// ============================================================================
// page: Export
// ============================================================================
function Export() {
  const [preset, setPreset] = useState("30 days");
  const [custom, setCustom] = useState({});
  const [exporting, setExporting] = useState(false);
  const [toast, setToast] = useState("");

  const [maxDiscount, setMaxDiscount] = useState(10);
  const [savingSettings, setSavingSettings] = useState(false);
  const [auditLog, setAuditLog] = useState([]);

  useEffect(() => {
    getSettings().then((s) => setMaxDiscount(s.staffMaxDiscountPercent)).catch(() => {});
    getDocs(query(collection(db, "auditLog"), orderBy("createdAt", "desc"), limit(20)))
      .then((snap) => setAuditLog(snap.docs.map((d) => { const data = d.data(); return { id: d.id, ...data, createdAt: data.createdAt?.toDate?.() ?? new Date() }; })))
      .catch(() => {});
  }, []);

  async function handleSaveSettings() {
    setSavingSettings(true);
    try { await updateSettings({ staffMaxDiscountPercent: Number(maxDiscount) || 0 }); setToast("Settings saved."); }
    finally { setSavingSettings(false); }
  }

  async function handleExport() {
    setExporting(true);
    try {
      const { from, to } = resolveRange(preset, custom);
      const [products, sales, corrections, adjustments, shifts] = await Promise.all([
        listProducts(), listSales({ from, to }), listCorrections({}), listAdjustments({}), listShifts({ max: 500 }),
      ]);

      const wb = XLSX.utils.book_new();

      XLSX.utils.book_append_sheet(wb, XLSX.utils.json_to_sheet(products.map((p) => ({
        SKU: p.sku, Name: p.name, Category: p.category,
        "Price (IDR)": p.price, "Cost (IDR)": p.cost ?? 0, "Margin (IDR)": (p.price ?? 0) - (p.cost ?? 0),
        "Stock on hand": p.stock, "Low stock threshold": p.lowStockThreshold, Status: stockStatus(p),
        Discount: p.discountType && p.discountType !== "none" ? `${p.discountType === "percent" ? p.discountValue + "%" : formatIDR(p.discountValue)}` : "",
      }))), "Products");

      const grossSales = sales.reduce((s, sale) => s + sale.subtotal, 0);
      const productDiscountTotal = sales.reduce((s, sale) => s + sale.productDiscountTotal, 0);
      const transactionDiscountTotal = sales.reduce((s, sale) => s + (sale.transactionDiscount?.amount ?? 0), 0);
      const netRevenue = sales.reduce((s, sale) => s + sale.total, 0);
      const cogs = sales.reduce((s, sale) => s + sale.items.reduce((a, it) => a + it.cost * it.qty, 0), 0);
      const grossProfit = netRevenue - cogs;
      const inRange = (d) => (!from || d >= from) && (!to || d <= to);
      const correctionsInRange = corrections.filter((c) => c.status === "approved" && inRange(c.createdAt));
      const adjustmentsInRange = adjustments.filter((a) => a.status === "approved" && inRange(a.createdAt));
      const voidedRevenue = correctionsInRange.reduce((s, c) => s + c.total, 0);
      const voidedCogs = correctionsInRange.reduce((s, c) => s + (c.items ?? []).reduce((a, it) => a + (it.cost ?? 0) * it.qty, 0), 0);
      const voidedProfit = voidedRevenue - voidedCogs;
      const stockLossValue = adjustmentsInRange.filter((a) => a.valuationTotal < 0).reduce((s, a) => s + Math.abs(a.valuationTotal), 0);
      const stockGainValue = adjustmentsInRange.filter((a) => a.valuationTotal > 0).reduce((s, a) => s + a.valuationTotal, 0);

      XLSX.utils.book_append_sheet(wb, XLSX.utils.json_to_sheet([
        { Line: "Gross sales (harga jual, list price)", "Amount (IDR)": grossSales },
        { Line: "− Product discounts", "Amount (IDR)": -productDiscountTotal },
        { Line: "− Transaction discounts", "Amount (IDR)": -transactionDiscountTotal },
        { Line: "= Revenue", "Amount (IDR)": netRevenue },
        { Line: "− Cost of goods sold (harga modal)", "Amount (IDR)": -cogs },
        { Line: "= Gross profit", "Amount (IDR)": grossProfit },
        { Line: "− Voided sales (revenue)", "Amount (IDR)": -voidedRevenue },
        { Line: "− Voided profit", "Amount (IDR)": -voidedProfit },
        { Line: "− Stock losses (damaged/lost/opname)", "Amount (IDR)": -stockLossValue },
        { Line: "+ Stock gains (opname surplus)", "Amount (IDR)": stockGainValue },
        { Line: "= Net revenue after voids", "Amount (IDR)": netRevenue - voidedRevenue },
        { Line: "= Net profit", "Amount (IDR)": grossProfit - voidedProfit - stockLossValue + stockGainValue },
      ]), "Profit & Loss");

      XLSX.utils.book_append_sheet(wb, XLSX.utils.json_to_sheet(sales.map((s) => ({
        Receipt: s.receiptNo, Date: s.createdAt.toLocaleString("id-ID"), Cashier: s.cashierName,
        "Payment method": s.paymentMethod, "Items count": s.items.reduce((a, it) => a + it.qty, 0),
        "Subtotal (IDR)": s.subtotal, "Discount (IDR)": s.productDiscountTotal + (s.transactionDiscount?.amount ?? 0),
        "Total (IDR)": s.total, "Amount received (IDR)": s.amountReceived, "Change given (IDR)": s.changeGiven,
        "Discount approved by": s.discountApproval?.managerName ?? "",
      }))), "Sales");

      XLSX.utils.book_append_sheet(wb, XLSX.utils.json_to_sheet(sales.flatMap((s) => s.items.map((it) => ({
        Receipt: s.receiptNo, Date: s.createdAt.toLocaleString("id-ID"), Cashier: s.cashierName, SKU: it.sku, Product: it.name, Qty: it.qty,
        "List price (IDR)": it.listPrice, "Unit price sold (IDR)": it.unitPrice, "Cost (IDR)": it.cost,
        "Line revenue (IDR)": it.unitPrice * it.qty, "Line profit (IDR)": (it.unitPrice - it.cost) * it.qty,
      })))), "Sale Line Items");

      XLSX.utils.book_append_sheet(wb, XLSX.utils.json_to_sheet(corrections.map((c) => ({
        "Original receipt": c.originalReceiptNo, "Requested at": c.createdAt.toLocaleString("id-ID"), "Requested by": c.requestedByName,
        Role: c.requestedByRole, Reason: c.reason, "Amount (IDR)": c.total, "Payment method": c.paymentMethod ?? "",
        Status: c.status, "Decided by": c.decidedByName ?? "", "Decided at": c.decidedAt ? c.decidedAt.toLocaleString("id-ID") : "",
      }))), "Void Corrections");

      XLSX.utils.book_append_sheet(wb, XLSX.utils.json_to_sheet(adjustments.map((a) => ({
        "Requested at": a.createdAt.toLocaleString("id-ID"), SKU: a.sku, Product: a.productName,
        Reason: REASON_TYPES[a.reasonType]?.label ?? a.reasonType, "Qty reported": a.qtyReported, "Stock change": a.qtyDelta,
        "Cost at time (IDR)": a.costAtTime, "Value (IDR)": a.valuationTotal, Note: a.note ?? "",
        "Requested by": a.requestedByName, Role: a.requestedByRole, Status: a.status, "Decided by": a.decidedByName ?? "",
      }))), "Stock Adjustments");

      XLSX.utils.book_append_sheet(wb, XLSX.utils.json_to_sheet(shifts.map((sh) => ({
        Staff: sh.staffName, Opened: sh.openedAt.toLocaleString("id-ID"), Closed: sh.closedAt ? sh.closedAt.toLocaleString("id-ID") : "",
        Status: sh.status, "Opening cash (IDR)": sh.openingCash, "Cash sales (IDR)": sh.cashSalesTotal ?? "",
        "Expected cash (IDR)": sh.expectedCash ?? "", "Actual cash (IDR)": sh.actualCash ?? "", "Variance (IDR)": sh.variance ?? "",
      }))), "Cash Shifts");

      const stamp = new Date().toISOString().slice(0, 10);
      XLSX.writeFile(wb, `kirakira-export-${preset.replace(/\s+/g, "-").toLowerCase()}-${stamp}.xlsx`);
      setToast("Export downloaded.");
    } catch (err) { setToast(err.message ?? "Export failed."); } finally { setExporting(false); }
  }

  return (
    <div>
      <div className="page-header">
        <div><h2>Export to Excel</h2><div className="subtitle">Download a workbook for accounting, business review, or planning.</div></div>
      </div>

      <div className="card" style={{ marginBottom: 20 }}>
        <div className="card-title">Sales date range</div>
        <div style={{ fontSize: 13, color: "var(--ink-soft)", marginBottom: 12 }}>
          Applies to Sales and Sale Line Items. Products, Void Corrections, Stock Adjustments, and Cash Shifts always export in full for audit continuity.
        </div>
        <DateRangeFilter preset={preset} onPresetChange={setPreset} custom={custom} onCustomChange={setCustom} />
        <button className="btn btn-primary" style={{ marginTop: 12 }} onClick={handleExport} disabled={exporting}>{exporting ? "Preparing file…" : "⬇️ Download .xlsx"}</button>
      </div>

      <div className="card" style={{ marginBottom: 20, maxWidth: 420 }}>
        <div className="card-title">POS settings</div>
        <div className="field"><label>Staff discount limit without approval (%)</label><input type="number" min="0" max="100" value={maxDiscount} onChange={(ev) => setMaxDiscount(ev.target.value)} /></div>
        <button className="btn btn-secondary" onClick={handleSaveSettings} disabled={savingSettings}>{savingSettings ? "Saving…" : "Save"}</button>
      </div>

      <div className="card">
        <div className="card-title">Recent price / stock edits</div>
        {auditLog.length === 0 ? <div className="empty-state">No direct catalogue edits logged yet.</div> : (
          <table>
            <thead><tr><th>When</th><th>Product</th><th>By</th><th>Before</th><th>After</th></tr></thead>
            <tbody>
              {auditLog.map((a) => (
                <tr key={a.id}>
                  <td>{a.createdAt.toLocaleString("id-ID")}</td><td>{a.productName}</td><td>{a.actorName}</td>
                  <td className="mono">P:{formatIDR(a.before.price ?? 0)} C:{formatIDR(a.before.cost ?? 0)} S:{a.before.stock ?? 0}</td>
                  <td className="mono">P:{formatIDR(a.after.price ?? 0)} C:{formatIDR(a.after.cost ?? 0)} S:{a.after.stock ?? 0}</td>
                </tr>
              ))}
            </tbody>
          </table>
        )}
      </div>
      {toast && <div className="toast">{toast}</div>}
    </div>
  );
}

// ============================================================================
// App shell — routing + guards
// ============================================================================
function RequireAuth({ children }) {
  const { user, loading } = useAuth();
  if (loading) return <FullScreenLoader />;
  if (!user) return <Navigate to="/login" replace />;
  return children;
}

function RequireManager({ children }) {
  const { isManager, loading } = useAuth();
  if (loading) return <FullScreenLoader />;
  if (!isManager) return <Navigate to="/" replace />;
  return children;
}

function FullScreenLoader() {
  return <div style={{ display: "flex", alignItems: "center", justifyContent: "center", height: "100vh", color: "var(--ink-soft)" }}>Loading…</div>;
}

function App() {
  return (
    <HashRouter>
      <Routes>
        <Route path="/login" element={<Login />} />
        <Route
          path="/*"
          element={
            <RequireAuth>
              <Layout>
                <Routes>
                  <Route path="/" element={<POS />} />
                  <Route path="/inventory" element={<Inventory />} />
                  <Route path="/labels" element={<Labels />} />
                  <Route path="/analytics" element={<RequireManager><AnalyticsManager /></RequireManager>} />
                  <Route path="/adjustments" element={<Adjustments />} />
                  <Route path="/shift" element={<Shift />} />
                  <Route path="/export" element={<RequireManager><Export /></RequireManager>} />
                  <Route path="*" element={<Navigate to="/" replace />} />
                </Routes>
              </Layout>
            </RequireAuth>
          }
        />
      </Routes>
    </HashRouter>
  );
}

// ============================================================================
// Render
// ============================================================================
const root = createRoot(document.getElementById("root"));
root.render(
  <React.StrictMode>
    <AuthProvider>
      <App />
    </AuthProvider>
  </React.StrictMode>
);

</script>
</body>
</html>
